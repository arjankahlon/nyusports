/* Pages live at real addresses on the web (/status, /active, /screening ...). Netlify's
   catch-all rewrite (netlify.toml) serves this file for them. Opened as a file, the
   page falls back to #/status style addresses. Old #/ links still work. */
const PAGE_KEYS = { studies: 'studies', active: 'active', paused: 'paused', notready: 'notready', enrolled: 'enrolled',
  status: 'admin', admin: 'admin', screening: 'screening' };
const usePaths = /^https?:$/.test(location.protocol);
function currentPage() {
  const fromHash = (location.hash.match(/^#\/(\w+)/) || [])[1];
  const seg = usePaths ? (location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || fromHash) : fromHash;
  return PAGE_KEYS[seg] || null;
}
const pageHref = key => { const seg = key === 'admin' ? 'status' : key; return usePaths ? `/${seg}` : `#/${seg}`; };
if (usePaths && /^#\/\w+/.test(location.hash) && currentPage()) history.replaceState(null, '', pageHref(currentPage()) + location.search);
if (!usePaths) document.querySelectorAll('a.navlink, a.homelink').forEach(a => { a.href = a.classList.contains('homelink') ? '#' : pageHref(PAGE_KEYS[a.getAttribute('href').slice(1)]); });

function route() {
  const key = currentPage();
  const valid = ['studies', 'active', 'paused', 'notready', 'enrolled', 'admin'].includes(key);
  $('home').hidden = valid || key === 'screening';
  $('detail').hidden = !valid;
  $('screening').hidden = key !== 'screening';
  setStatusMode(key === 'admin');
  if (valid) { renderDetail(key); window.scrollTo(0, 0); }
  else if (key === 'screening') { renderScreening(); window.scrollTo(0, 0); }
  else if (state.homeScroll != null) { window.scrollTo(0, state.homeScroll); }
}
function goHome() {
  if (history.state && history.state.fromHome) history.back();
  else { history.replaceState(null, '', (usePaths ? '/' : location.pathname) + location.search); route(); }
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const a = e.target.closest('a.navlink, a.homelink');
  if (!a) return;
  e.preventDefault();
  if (a.classList.contains('homelink')) { if (currentPage()) goHome(); return; }
  state.homeScroll = window.scrollY;
  history.pushState({ fromHome: true }, '', a.getAttribute('href'));
  route();
});
window.addEventListener('popstate', route);

/* Bar scale for studies without a target N.
   BAR_MODE 'hundreds' (current): every bar is out of 100; past 100 it moves to
     the next 100 (134 -> 200).
   BAR_MODE 'ladder' (earlier protocol, kept to switch back): steps 10, 25, 50,
     100, 200, 300, ...; a study moves up a step once it reaches BUMP_AT (70%)
     of the current one (e.g. 35 of 50 moves to the 100 bar).
   Either way the label reads "N / No target set", and Synovial Fluid
   Biomarkers gets no bar. */
const BAR_MODE = 'hundreds';
const BUMP_AT = 0.7;
const SYNOVIAL = /^synovial fluid biomarkers$/i;
const NO_SCALE = [SYNOVIAL];
function barMax(s) {
  if (!s.n) return null;
  if (s.n.target) return s.n.target;
  if (NO_SCALE.some(re => re.test(s.title))) return null;
  const n = s.n.enrolled;
  if (BAR_MODE === 'hundreds') return Math.max(100, Math.ceil(n / 100) * 100);
  for (const step of [10, 25, 50]) if (n < step * BUMP_AT) return step;
  let step = 100;
  while (n >= step * BUMP_AT) step += 100;
  return step;
}
const barPct = s => Math.min(100, s.n.enrolled / barMax(s) * 100);
const barFill = s => `<div class="track"><div class="fill" style="width:${barPct(s)}%;background:${STATUS[s.status].color}"></div></div>`;

function renderEnroll() {
  // real targets first (by % complete), then scaled bars, then studies with no bar
  const rank = s => s.n.target ? 0 : barMax(s) ? 1 : 2;
  const rows = filtered().filter(s => s.n && s.n.enrolled > 0).sort((a, b) =>
    rank(a) - rank(b) || (rank(a) < 2 ? barPct(b) - barPct(a) : 0) || b.n.enrolled - a.n.enrolled);
  if (!rows.length) { $('enroll').innerHTML = '<div class="nottarget">No studies with an N count match the filters.</div>'; return; }
  $('enroll').innerHTML = rows.map(s => {
    const { enrolled, target, note } = s.n;
    const max = barMax(s);
    const tip = `${esc(s.title)}<br>${STATUS[s.status].label} · N = ${enrolled}${target ? ` / ${target} (${Math.round(enrolled / target * 100)}%)` : ' · no target set'}${note ? ' ' + esc(note) : ''}`;
    return `<div class="erow" role="button" tabindex="0" data-slide="${s.slide}" data-tip="${esc(tip)}">
      <div class="nm">${esc(s.title)}</div>
      ${max ? barFill(s) : `<div class="nottarget">${note ? esc(note) : ''}</div>`}
      <div class="val">${enrolled.toLocaleString()}<small> / ${target ? target : 'No target set'}</small></div>
    </div>`;
  }).join('');
  $('enroll').querySelectorAll('.erow').forEach(r => {
    r.onclick = () => { $('tip').style.display = 'none'; openSlide(+r.dataset.slide); };
    r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); r.onclick(); } };
  });
}

/* Two PI dropdowns ("Filter by PI" above the list, "PI view" in the header) share
   one selection: changing either updates both, the study list, the chart and the tiles. */
const PI_LABELS = {
  filter: (n, one) => n === 0 ? 'Filter by PI' : n === 1 ? `PI: ${one}` : `PI: ${n} selected`,
  head: (n, one) => n === 0 ? 'PI view' : n === 1 ? one : `${n} PIs`,
};
const piLabel = kind => PI_LABELS[kind](state.pis.size, [...state.pis][0]);
const CARET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
/* People left out of the PI dropdowns (they still show on study PI lines). */
const PI_HIDDEN = new Set(['Alon Shertzer', 'Cardone', 'Popovic']);
const lastName = p => p.split(/\s+/).pop();
const piChoices = () => [...new Set(state.studies.flatMap(piList))].filter(p => !PI_HIDDEN.has(p))
  .sort((a, b) => lastName(a).localeCompare(lastName(b)) || a.localeCompare(b));
function piMenuHtml(kind) {
  const pis = piChoices();
  return `<details class="pidrop pidrop-${kind}" data-pidrop="${kind}"><summary class="${kind === 'head' ? 'pibig' : 'chip'} ${state.pis.size ? 'on' : ''}"><span class="pilbl">${esc(piLabel(kind))}</span>${CARET}</summary>
    <div class="pimenu">${pis.map(p => `<label><input type="checkbox" value="${esc(p)}" ${state.pis.has(p) ? 'checked' : ''}><span>${esc(p)}</span><small>${state.studies.filter(s => piList(s).includes(p)).length}</small></label>`).join('')}
      <button type="button" class="piclear">Clear</button></div></details>`;
}
/* A small burst of purple confetti from the dropdown when a PI is picked. */
function confetti(fromEl) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !fromEl) return;
  const r = fromEl.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);
  const colors = ['#57068c', '#7b2fbf', '#a066d9', '#c9a6ee', '#8b3fd1'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i');
    p.style.background = colors[i % colors.length];
    p.style.left = x0 + 'px'; p.style.top = y0 + 'px';
    if (i % 3 === 0) p.style.borderRadius = '50%';
    layer.appendChild(p);
    const ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 70;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 30, spin = (Math.random() - .5) * 720;
    p.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${spin / 2}deg)`, opacity: 1, offset: .55 },
      { transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy + 55}px)) rotate(${spin}deg)`, opacity: 0 },
    ], { duration: 850 + Math.random() * 350, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
  }
  setTimeout(() => layer.remove(), 1400);
}

function bindPiMenu(root) {
  root.querySelectorAll('.pimenu input').forEach(cb => cb.onchange = () => {
    cb.checked ? state.pis.add(cb.value) : state.pis.delete(cb.value);
    piChanged();
    if (cb.checked) confetti(cb.closest('details').querySelector('summary'));
  });
  root.querySelectorAll('.piclear').forEach(b => b.onclick = () => { state.pis.clear(); piChanged(); });
}
const PI_KEY = 'prospective-studies:pi-view';
function savePis() { try { localStorage.setItem(PI_KEY, JSON.stringify([...state.pis])); } catch (e) { /* storage unavailable */ } }
function restorePis() {
  try {
    const known = new Set(piChoices());
    JSON.parse(localStorage.getItem(PI_KEY) || '[]').filter(p => known.has(p)).forEach(p => state.pis.add(p));
  } catch (e) { /* ignore */ }
}
function piChanged() {
  savePis();
  document.querySelectorAll('[data-pidrop]').forEach(d => {
    d.querySelectorAll('.pimenu input').forEach(cb => cb.checked = state.pis.has(cb.value));
    d.querySelector('.pilbl').textContent = piLabel(d.dataset.pidrop);
    d.querySelector('summary').classList.toggle('on', state.pis.size > 0);
  });
  renderKpis(); renderList(); renderEnroll();
  const key = currentPage();
  if (key && !$('detail').hidden) renderDetail(key);
}
function renderPiHead() { $('piHead').innerHTML = piMenuHtml('head'); bindPiMenu($('piHead')); }

const settingSegHtml = () => {
  const SHORT = { all: 'All', or: 'OR', office: 'Office' };
  return `<div class="seg">${SETTING_FILTERS.map(([k, label]) => `<button class="${state.setting === k ? 'on' : ''}" data-setting="${k}"><span class="lg">${label}</span><span class="sm">${SHORT[k]}</span></button>`).join('')}</div>`;
};

function renderFilters() {
  const cats = [...new Set(state.studies.map(s => s.category))].filter(c => !HIDDEN_CATEGORY_CHIPS.includes(c)).sort();
  $('filters').innerHTML =
    `<div class="frow">${settingSegHtml()}
      ${piMenuHtml('filter')}</div>` +
    `<div class="frow"><input class="search" id="q" type="search" placeholder="Search title, PI, updates" value="${esc(state.q)}">
      <label class="areadrop chip ${state.category !== 'All' ? 'on' : ''}"><span>${state.category === 'All' ? 'Body area' : esc(state.category)}</span>${CARET}
        <select id="areaSel" aria-label="Body area"><option value="All">All body areas</option>${cats.map(c => `<option value="${esc(c)}" ${state.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label></div>`;
  $('areaSel').onchange = e => { state.category = e.target.value; render(); };
  $('filters').querySelectorAll('[data-setting]').forEach(b => b.onclick = () => { state.setting = b.dataset.setting; render(); });
  bindPiMenu($('filters'));
  const q = $('q');
  q.oninput = () => { state.q = q.value; renderList(); renderEnroll(); };
}

function card(s, note = '') {
  const n = s.n;
  const prog = n ? (n.target
      ? `<div class="prog"><div class="lbl"><span>Enrollment</span><b>${n.enrolled} / ${n.target} · ${Math.round(n.enrolled / n.target * 100)}%</b></div>${barFill(s)}</div>`
      : `<div class="prog"><div class="lbl"><span>Enrollment</span><b>${n.enrolled.toLocaleString()} / No target set${n.note ? ' · ' + esc(n.note) : ''}</b></div>${barMax(s) ? barFill(s) : ''}</div>`)
    : '';
  return `<article class="card ${s.status}">
    <div class="row1">${pill(s)}${settingTag(s)}<span class="tag">${esc(s.category)}</span>${/grant/i.test(s.section) ? '<span class="tag sec">Grant</span>' : ''}
      <button class="slidelink" type="button" data-slide="${s.slide}">View details</button></div>
    <h3>${esc(s.title)}</h3>
    ${note}
    ${reasonHtml(s)}
    <div class="meta">
      ${s.pi ? `<div><b>PI:</b> ${esc(s.pi)}</div>` : ''}
      ${s.irb ? `<div><b>Study ID:</b> ${esc(s.irb)}${s.irbEnd ? ` · expires ${esc(s.irbEnd)}` : ''}</div>` : ''}
    </div>
    ${prog}
    ${s.summary ? `<div class="summary" title="Click to expand">${esc(s.summary)}</div>` : ''}
    ${criteriaToggleHtml(s)}
  </article>`;
}

function renderList() {
  const rows = filtered().sort((a, b) => STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status) || a.slide - b.slide);
  if (!rows.length) { $('list').innerHTML = '<div class="empty">No studies match these filters.</div>'; return; }
  $('list').innerHTML = `<div class="grid">${rows.map(s => card(s)).join('')}</div>`;
  bindCards($('list'));
}
function bindCards(root) {
  root.querySelectorAll('.summary').forEach(el => el.onclick = () => el.classList.toggle('open'));
  root.querySelectorAll('[data-slide]').forEach(b => b.onclick = () => openSlide(+b.dataset.slide));
}

/* ---------------------------------------------------------------------------
   SCREEN MY PATIENTS: pick what a patient is having done (or has, or where
   they're seen) to see the studies that could enroll them. The choices come
   from the master sheet's Lists tab, plus any tag already used on a study;
   studies are matched on their sheet columns. Nothing picked leaves the page.
--------------------------------------------------------------------------- */
const SCREEN_MODES = [
  { key: 'procedures', tab: 'Procedure', list: 'Procedures', ask: 'My patient is getting a:', what: 'procedures',
    tags: s => s.sheet ? s.sheet.procedures : [] },
  { key: 'injuries', tab: 'Injury', list: 'Injuries / Diagnoses', ask: 'My patient has:', what: 'injuries or diagnoses',
    tags: s => s.sheet ? s.sheet.injuries : [] },
  { key: 'setting', tab: 'Setting', list: 'Setting', ask: "I'm seeing my patient in the:", what: 'an OR / Office setting',
    tags: s => studySetting(s).tags },
  { key: 'area', tab: 'Body area', list: 'Area', ask: "My patient's injury is in the:", what: 'a body area',
    tags: s => [s.category] },
];
const SCREEN_GROUPS = { active: 'Enrolling now', paused: 'Paused', notready: 'Not enrolling yet' };
state.screen = { mode: 'procedures', picks: new Set() };
let screenLists = null; // {Lists tab column: [choices]}; {} if it couldn't be read

async function fetchLists() {
  const res = await fetch(`https://docs.google.com/spreadsheets/d/${CONFIG.sheet.id}/gviz/tq?tqx=out:csv&sheet=Lists`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Google returned ${res.status} for the Lists tab`);
  const [head, ...rows] = parseCsv(await res.text());
  return Object.fromEntries(head.map((h, i) => [h.trim(), rows.map(r => (r[i] || '').trim()).filter(Boolean)]));
}

function renderScreening() {
  if (screenLists === null) {
    screenLists = undefined; // loading
    fetchLists().catch(() => ({})).then(l => { screenLists = l; if (!$('screening').hidden) renderScreening(); });
  }
  const mode = SCREEN_MODES.find(m => m.key === state.screen.mode);
  const picks = state.screen.picks;
  const S = state.studies;
  const listed = (screenLists && screenLists[mode.list]) || [];
  const used = [...new Set(S.flatMap(mode.tags))].filter(t => !listed.includes(t)).sort();
  const opts = [...listed, ...used];
  const count = t => S.filter(s => mode.tags(s).includes(t)).length;
  const matched = s => mode.tags(s).filter(t => picks.has(t));
  const hits = S.filter(s => matched(s).length);

  const untagged = S.filter(s => !mode.tags(s).length).length;
  let note = '';
  if ((mode.key === 'procedures' || mode.key === 'injuries') && state.data.source !== 'sheet') {
    note = 'The master sheet couldn\'t be reached, so procedure and injury tags aren\'t available right now. Try Refresh on the home page.';
  } else if (mode.key !== 'area' && untagged) {
    note = `${untagged} of ${S.length} studies don't have ${mode.what} filled in on the master sheet yet, so they won't show up here.`;
  }

  let results;
  if (!picks.size) results = '<div class="empty">Pick one or more above to see matching studies.</div>';
  else if (!hits.length) results = `<div class="empty">No studies are tagged with ${[...picks].map(esc).join(' or ')} yet.</div>`;
  else {
    results = `<h3 class="scr-count">${hits.length} ${hits.length === 1 ? 'study' : 'studies'}</h3>` +
      STATUS_ORDER.map(k => {
        const g = hits.filter(s => s.status === k).sort(bySlide);
        return g.length ? `<div class="scr-group"><h3>${SCREEN_GROUPS[k]} <span>${g.length}</span></h3>
          <div class="grid">${g.map(s => card(s, `<div class="scr-match">Matches: ${matched(s).map(esc).join(', ')}</div>`)).join('')}</div></div>` : '';
      }).join('');
  }

  $('sBody').innerHTML = `<h2 class="dtitle">Screen my patients</h2>
    <p class="dsub">Pick what applies to your patient to see which studies could enroll them. Nothing you pick is saved or sent anywhere.</p>
    <div class="scr-step"><div class="scr-label">Filter by</div>
      <div class="seg scr-modes">${SCREEN_MODES.map(m => `<button type="button" class="${m === mode ? 'on' : ''}" data-mode="${m.key}">${m.tab}</button>`).join('')}</div></div>
    <div class="scr-step"><div class="scr-label">${esc(mode.ask)}</div>
      <div class="scr-opts">${opts.map(t => {
        const n = count(t), on = picks.has(t);
        return `<button type="button" class="chip ${on ? 'on' : ''} ${n ? '' : 'zero'}" data-pick="${esc(t)}" aria-pressed="${on}">${esc(t)}<span class="n">${n}</span></button>`;
      }).join('') || `<span class="empty">${screenLists === undefined ? 'Loading choices…' : 'No choices on the Lists tab yet.'}</span>`}</div>
      ${picks.size ? '<button class="scr-clear" type="button" id="scrClear">Clear</button>' : ''}</div>
    ${note ? `<p class="scr-note">${esc(note)}</p>` : ''}
    ${results}`;

  $('sBody').querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    if (b.dataset.mode === state.screen.mode) return;
    state.screen = { mode: b.dataset.mode, picks: new Set() };
    renderScreening();
  });
  $('sBody').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const t = b.dataset.pick;
    picks.has(t) ? picks.delete(t) : picks.add(t);
    renderScreening();
  });
  if ($('scrClear')) $('scrClear').onclick = () => { picks.clear(); renderScreening(); };
  bindCards($('sBody'));
}

// Names on the study's Team line (a missing comma like "John Mallory" still splits into two people)
const teamNames = s => (parseFields(s.parts.details || '').team || '').split(/[,;&/]|\band\b/)
  .flatMap(part => { const w = part.trim().split(/\s+/).filter(Boolean); return w.every(x => TEAM_EMAILS[x.toLowerCase()]) ? w : [part.trim()]; })
  .filter(Boolean);
const teamEmail = name => TEAM_EMAILS[name.split(/\s+/)[0].toLowerCase()];
RESEARCHERS.forEach(r => r.aliases.forEach(a => { TEAM_EMAILS[a] = TEAM_EMAILS[a] || r.email; }));

/* slide viewer: written transcription of the slide (plus a live image when signed in) */
function fmtBox(text) {
  return esc(text)
    .replace(/^(\s*)IRB(\s*:)/gim, '$1Study ID$2') // the slide's "IRB:" line holds the study ID
    .replace(/^(PI|Team|Fellows?|Summary|Goal|Study ID|Inclusion\/Exclusion|Approval end date|Updates)(\s*:)/gim, '<span class="k">$1$2</span>')
    .replace(/(N\s*=\s*[^\n]+)/i, '<span class="sc-n">$1</span>');
}

function withEmailAll(html, s) {
  const names = teamNames(s);
  const emails = [...new Set(names.map(teamEmail).filter(Boolean))];
  if (!emails.length) return html;
  const label = names.every(teamEmail) ? '[email all]' : '[email current team]'; // current team = everyone with an email on file
  const link = ` <a class="emailall" href="mailto:${emails.join(',')}">${label}</a>`;
  return html.replace(/(<span class="k">Team:<\/span>[^\n]*)/, `$1${link}`);
}

async function openSlide(n) {
  const s = state.studies.find(x => x.slide === n);
  if (!s) return;
  const p = s.parts;
  $('vTitle').textContent = `Slide ${s.slide}`;
  $('vSuggest').href = $('vSuggestTop').href = suggestHref(s);
  $('vBody').innerHTML = `
    <div id="vThumb"></div>
    <div class="slidecard">
      <div class="sc-top"><span class="sc-cat">${esc(s.category)}</span>${pill(s)}</div>
      <h4>${esc(s.title)}</h4>
      ${reasonHtml(s)}
      <div class="sc-cols">
        ${p.details ? `<div class="sc-box">${withEmailAll(fmtBox(p.details), s)}</div>` : ''}
        ${p.updates ? `<div class="sc-box">${fmtBox(p.updates)}</div>` : ''}
      </div>
      ${p.other.length ? `<div class="sc-box">${p.other.map(esc).join('\n\n')}</div>` : ''}
      ${criteriaHtml(s, 'sc-box crit crit-full')}
    </div>`;
  if (!$('viewer').open) { $('viewer').showModal(); document.documentElement.classList.add('locked'); }
  $('vBody').scrollTop = 0;
}

function render() {
  renderKpis(); renderEnroll(); renderFilters(); renderPiHead(); renderList();
  const d = state.data;
  const when = new Date(d.syncedAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  $('sync').innerHTML = `${{ sheet: 'Synced from slides', live: 'Updated from slides' }[d.source] || 'Snapshot'} · ${when}`;
}

const SUGGEST_TO = ['arjankahlon@gmail.com', 'arjan.kahlon@nyulangone.org'].join(',');
const SUGGEST_SUBJECT = 'Sports Prospective Studies Website Feedback';
function suggestHref(study) {
  const subject = SUGGEST_SUBJECT;
  const body = study
    ? `Study: ${study.title}\nSlide: ${study.slide}\nCurrent status: ${study.statusLabel}\n\nSuggested change:\n`
    : 'Suggested change:\n';
  return `mailto:${SUGGEST_TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
document.querySelectorAll('[data-suggest]').forEach(a => a.href = suggestHref());

// The sheet carries its own adjustments, so the code's list only matters for slide data.
const unmatchedOverrides = () => state.data.source === 'sheet' ? [] : STUDY_OVERRIDES.filter(o => !o.hits);
function load(data) {
  state.data = data;
  state.studies = buildStudies(data);
  render();
  const unmatched = unmatchedOverrides();
  if (unmatched.length) {
    $('notice').innerHTML = `Some manual adjustments didn't match any slide, so they weren't applied (a title may have changed in the deck): ${unmatched.map(o => `<code>${esc(String(o.match))}</code>`).join(', ')}`;
    $('notice').classList.add('show');
  }
  const key = currentPage();
  if (key && !$('detail').hidden) renderDetail(key);
  if (!$('screening').hidden) renderScreening();
}

/* tooltip */
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip;
  tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});

/* refresh */
$('refreshBtn').onclick = async () => {
  const btn = $('refreshBtn'), notice = $('notice');
  notice.classList.remove('show');
  const lbl = $('refreshLbl'), idle = lbl.textContent;
  btn.disabled = true; btn.classList.add('spin');
  lbl.textContent = 'Checking slides…';
  try {
    // The master sheet first (it syncs from the slides on its own); the slides if it can't be read.
    const sheet = await fetchSheet().catch(() => null);
    if (sheet) { load(sheet); saveSheet(sheet); return; }
    const shared = await sharedRequest('POST');
    const data = shared && shared.data
      ? shared.data
      : await fetchLive(bytes => { lbl.textContent = `Reading slides… ${(bytes / 1048576).toFixed(1)} MB`; });
    load(data);
    saveLive(data);
  } catch (err) {
    // Google only answers pages that have a web address; a page opened as a file (or in a preview) has none
    const noAddress = location.protocol === 'file:' || location.origin === 'null';
    notice.textContent = 'Refresh failed: ' + (err.name !== 'TypeError' ? err.message
      : noAddress ? 'Refresh only works when this page is opened from a web address, not as a file. Showing the last saved data.'
      : "couldn't reach Google. Check the connection and try again.");
    notice.classList.add('show');
  } finally {
    btn.disabled = false; btn.classList.remove('spin');
    lbl.textContent = idle;
  }
};

document.addEventListener('click', e => document.querySelectorAll('details.pidrop[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }));
$('dBack').onclick = goHome;
$('dClose').onclick = goHome;
$('sBack').onclick = goHome;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (!$('detail').hidden || !$('screening').hidden) && !$('viewer').open) goHome(); });
$('viewer').addEventListener('click', e => { if (e.target === $('viewer')) $('viewer').close(); }); // tap backdrop to close
$('viewer').addEventListener('close', () => document.documentElement.classList.remove('locked'));
const brandEl = document.querySelector('.brand');
const setBrandH = () => document.documentElement.style.setProperty('--brand-h', brandEl.offsetHeight + 'px');
new ResizeObserver(setBrandH).observe(brandEl); setBrandH();
const initial = savedSheet() || savedLive() || SNAPSHOT;
state.data = initial; state.studies = buildStudies(initial); restorePis(); restoreResearchers();
load(initial);
route();
fetchSheet().then(sheet => { load(sheet); saveSheet(sheet); }).catch(() => sharedRequest('GET').then(res => {
  if (res && res.data && new Date(res.data.syncedAt) > new Date(state.data.syncedAt)) { load(res.data); saveLive(res.data); }
})).catch(() => { /* keep what's showing */ });
</script>
</body>
</html>
