<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3f7">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prospective Studies (Sports)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="format-detection" content="telephone=no">
<title>Prospective Studies (Sports)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Creepster&family=Lobster&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3f7;
    --surface: #fcfcfb;
    --surface-2: #efeef4;
    --border: #e2e0ea;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #7a7873;
    --accent: #6a2fa0;
    --accent-soft: #efe6f8;
    --track: #e7e5ee;
    /* status palette (reserved; always paired with icon + label) */
    --st-active: #0ca30c;
    --st-paused: #fab219;
    --st-na: #9a98a3;
    --st-none: #c9c7d1;
    --st-active-ink: #006300;
    --st-paused-ink: #8a5a00;
    --st-na-ink: #52514e;
    --shadow: 0 1px 2px rgba(20, 10, 40, .05), 0 4px 16px rgba(20, 10, 40, .05);
    --brand: #57068c;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c-other: #b4b2bb;
    --slide-bg: #d9d2e9;
    --slide-ink: #1d1530;
    --slide-title: #5b1f9a;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: light only; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    justify-content: space-between; margin-bottom: 20px;
  }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
  .sub a { color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sync { color: var(--muted); font-size: 12px; text-align: right; }
  button.refresh {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 16px; font: 600 14px Inter, sans-serif; cursor: pointer;
  }
  button.refresh:disabled { opacity: .6; cursor: progress; }
  button.refresh svg { width: 16px; height: 16px; }
  button.refresh.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .notice {
    display: none; background: var(--accent-soft); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: var(--text-2);
  }
  .notice.show { display: block; }
  .notice code { background: var(--surface); padding: 1px 5px; border-radius: 4px; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (min-width: 641px) and (max-width: 860px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis .kpi:nth-child(n+4) { grid-column: span 1; } }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi .label { color: var(--text-2); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .note { color: var(--muted); font-size: 12px; }

  .panels { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; box-shadow: var(--shadow); min-width: 0;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .panel h2 span { color: var(--muted); font-weight: 400; }
  /* Enrollment Dashboard: collapsed until opened */
  .enrollwrap summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .enrollwrap summary::-webkit-details-marker { display: none; }
  .enrollwrap summary h2 { font-size: 18px; margin: 0; }
  .enrollwrap summary h2 .when-open { font-size: 14px; }
  .enrollwrap[open] summary { margin-bottom: 12px; }
  .etoggle { flex: none; color: var(--accent); font-weight: 600; font-size: 14px; }
  .etoggle .when-closed { font-size: 24px; line-height: 1; font-weight: 500; }
  .enrollwrap .when-open, .enrollwrap[open] .when-closed { display: none; }
  .enrollwrap[open] .when-open { display: inline; }
  .enrollwrap summary:hover .etoggle { text-decoration: underline; }


  /* status pill */
  .pill {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
    padding: 2px 9px 2px 6px; font-size: 12px; font-weight: 600; white-space: nowrap;
    background: var(--surface-2); color: var(--text-2);
  }
  .pill svg { width: 13px; height: 13px; flex: none; }
  .pill.active { color: var(--st-active-ink); background: color-mix(in srgb, var(--st-active) 14%, transparent); }
  .pill.paused { color: var(--st-paused-ink); background: color-mix(in srgb, var(--st-paused) 20%, transparent); }
  .pill.notready { color: var(--st-na-ink); }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  /* enrollment chart */
  .enroll { display: grid; gap: 6px; }
  .erow {
    display: grid; grid-template-columns: minmax(120px, 230px) 1fr minmax(76px, auto); align-items: center; gap: 10px;
    padding: 3px 4px; border-radius: 6px; cursor: pointer; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .erow:hover { background: var(--surface-2); }
  .erow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); font-size: 13px; }
  .erow .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text); }
  .erow .val small { color: var(--muted); }
  .track { height: 10px; background: var(--track); border-radius: 4px; position: relative; overflow: hidden; }
  .fill { height: 100%; border-radius: 0 4px 4px 0; }
  .nottarget { color: var(--muted); font-size: 12px; }
  .tip {
    position: fixed; pointer-events: none; z-index: 10; background: var(--text); color: var(--surface);
    font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 280px; display: none;
  }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 22px 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .drops { display: flex; gap: 8px; align-items: center; flex: none; }
  .areadrop { position: relative; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .areadrop svg { width: 14px; height: 14px; }
  .areadrop select { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 16px; }
  .settag {
    display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .pidrop { position: relative; flex: none; }
  .pidrop summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
  .pidrop summary::-webkit-details-marker { display: none; }
  .pidrop summary svg { width: 14px; height: 14px; }
  .pidrop[open] summary svg { transform: rotate(180deg); }
  .pimenu {
    position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; width: 240px; max-height: 340px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
    box-shadow: 0 10px 30px rgba(20, 10, 40, .18); overscroll-behavior: contain;
  }
  .pimenu label { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .pimenu label:hover { background: var(--surface-2); }
  .pimenu input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .pimenu label span { flex: 1; }
  .pimenu label small { color: var(--muted); }
  .piclear { width: 100%; min-height: 40px; margin-top: 4px; border: 0; border-top: 1px solid var(--border); background: none; color: var(--accent); font: 600 14px Inter, sans-serif; cursor: pointer; }
  .tools { display: flex; gap: 8px; align-items: center; flex: 1 1 280px; justify-content: flex-end; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    border-radius: 999px; padding: 5px 12px; font: 500 13px Inter, sans-serif; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .search {
    flex: 1 1 200px; min-width: 0; max-width: 320px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 7px 12px; font: 13px Inter, sans-serif;
  }
  .viewtoggle { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  /* filter rows: [All | OR | Office] ... [Filter by PI] / [search] [Body area] */
  #filters.filters { display: block; margin: 22px 0 14px; }
  .frow { display: flex; align-items: center; gap: 8px; }
  .frow + .frow { margin-top: 10px; }
  .frow .pidrop { margin-left: auto; }
  .frow .pidrop-filter .pimenu { left: auto; right: 0; }
  .frow .search { flex: 1 1 auto; max-width: none; margin: 0; }
  .frow .areadrop { flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); flex: none; }
  .seg button { border: 0; background: none; color: var(--text-2); padding: 7px 14px; font: 500 13px Inter, sans-serif; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .seg .sm { display: none; }
  .viewtoggle button { border: 0; background: var(--surface); color: var(--text-2); padding: 6px 12px; font: 500 13px Inter, sans-serif; cursor: pointer; }
  .viewtoggle button.on { background: var(--surface-2); color: var(--text); }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
    border-top: 4px solid var(--st-none);
  }
  .card.active { border-top-color: var(--st-active); }
  .card.paused { border-top-color: var(--st-paused); }
  .card.notready { border-top-color: var(--st-na); }
  .card .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .tag.sec { color: var(--muted); }
  .slidelink { margin-left: auto; font-size: 12px; color: var(--muted); text-decoration: none; }
  .slidelink:hover { color: var(--accent); text-decoration: underline; }
  .card h3 { margin: 0; font-size: 15px; line-height: 1.3; }
  .meta { font-size: 13px; color: var(--text-2); display: grid; gap: 2px; }
  .meta b { color: var(--text); font-weight: 600; }
  .summary { font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .summary.open { -webkit-line-clamp: unset; }
  .prog { display: grid; gap: 4px; }
  .prog .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
  .prog .lbl b { color: var(--text); font-variant-numeric: tabular-nums; }
  .updates { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  /* inclusion / exclusion criteria */
  .critwrap { background: var(--surface-2); border-radius: 8px; }
  .critwrap summary {
    list-style: none; cursor: pointer; padding: 8px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .critwrap summary::-webkit-details-marker { display: none; }
  .critwrap summary:hover { color: var(--accent); }
  .critwrap .when-open, .critwrap[open] .when-closed { display: none; }
  .critwrap[open] .when-open { display: inline; }
  .critwrap .crit { padding-top: 0; background: none; }
  a.emailall { color: #1a5fd0; text-decoration: underline; white-space: nowrap; }
  .crit { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4;
          display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; color: var(--text-2); }
  .crit .h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  .crit .sub { font-size: 11.5px; font-weight: 600; color: var(--text); margin-top: 2px; }
  .crit ul { margin: 0 0 2px; padding-left: 15px; }
  .crit li { margin: 1px 0; }
  .slidecard .crit-full { background: var(--surface); white-space: normal; font-size: 13px; color: var(--slide-ink); }
  /* stacked on phones: a blank line's worth of space before Exclusion */
  @media (max-width: 420px) { .crit { grid-template-columns: 1fr; row-gap: 18px; } }
  .updates .h { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .updates ul { margin: 0; padding-left: 16px; color: var(--text-2); }
  .empty { color: var(--muted); padding: 30px; text-align: center; }

  /* table */
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; font-size: 13px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  footer { color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* suggest change */
  .btnrow { display: flex; gap: 8px; align-items: stretch; width: 460px; max-width: 100%; }
  .btnrow > #refreshBtn { flex: 2 1 0; justify-content: center; }
  .btnrow > #piHead { flex: 1 1 0; min-width: 0; }
  /* PI view: same box as the old Suggest change button, with a caret instead of the pen */
  .pidrop summary.pibig {
    display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; height: 100%; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--accent);
    font: 600 14px Inter, sans-serif; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .pidrop summary.pibig svg { width: 16px; height: 16px; }
  .pibig:hover, .pibig.on { border-color: var(--accent); background: var(--accent-soft); }
  #piHead, .pidrop-head { display: flex; }
  .pidrop-head { flex: 1; min-width: 0; }
  .pidrop-head summary.pibig { flex: 1; min-width: 0; }
  .btnrow > * { min-width: 0; }
  .pibig .pilbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pidrop-head .pimenu { left: auto; right: 0; }
  button.refresh { min-height: 40px; }
  a.suggest {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--accent);
    font: 600 14px Inter, sans-serif; text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  }
  a.suggest:hover, a.suggest:active { border-color: var(--accent); background: var(--accent-soft); }
  a.suggest svg { width: 16px; height: 16px; flex: none; }
  /* small Suggest change under the byline */
  a.suggest.mini { min-height: 30px; padding: 0 10px; gap: 5px; border-radius: 8px; font: 600 12px Inter, sans-serif; }
  a.suggest.mini svg { width: 13px; height: 13px; }
  .suggestbar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 24px 0 8px; }
  .vfoot { align-items: center; }

  /* paused reason under the title */
  .reason {
    display: flex; gap: 6px; align-items: flex-start; font-size: 13px; font-weight: 600; color: var(--st-paused-ink);
    background: color-mix(in srgb, var(--st-paused) 14%, transparent); border-radius: 8px; padding: 6px 9px;
  }
  .reason svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
  .drow .reason { font-size: 12px; padding: 4px 8px; margin-top: 2px; }
  .slidecard .reason { background: var(--surface); }

  /* branding */
  .brand {
    display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 6px 16px;
    padding: 10px 0 12px; margin: -10px 0 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30; background: var(--bg);
  }
  .brandright { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .logo { height: 44px; width: auto; display: block; }
  .byline { font-size: 10px; color: var(--muted); white-space: nowrap; }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
  .confetti i { position: absolute; width: 7px; height: 5px; border-radius: 1px; }

  /* welcome line for the selected PI */
  .welcome { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 4px 0 16px; }
  .welcome[hidden] { display: none; }
  .wtext { min-width: 0; font-size: 24px; line-height: 1.25; letter-spacing: -.01em; }
  .w1 { color: var(--text-2); font-weight: 500; }
  .w2 { font-weight: 700; overflow-wrap: break-word; }
  .wphotos { display: flex; flex: none; }
  .wphotos img { width: 168px; height: 168px; border-radius: 50%; object-fit: cover; border: 3px solid var(--surface); box-shadow: 0 2px 6px rgba(20, 10, 40, .18); }
  .wphotos img + img { margin-left: -36px; }

  a.screenbtn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin: 4px 0 16px;
    border-radius: 12px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    color: var(--accent); font: 700 16px Inter, sans-serif; text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  a.screenbtn:hover, a.screenbtn:active { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .homelink { display: inline-flex; }

  /* KPI tiles are links to breakdown pages */
  a.kpi { color: inherit; text-decoration: none; cursor: pointer; transition: border-color .15s, transform .15s; -webkit-tap-highlight-color: transparent; }
  a.kpi:hover { border-color: var(--accent); }
  a.kpi:active { transform: scale(.98); }
  a.kpi:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .kpi .chev { width: 14px; height: 14px; margin-left: auto; color: var(--muted); }

  /* nav buttons */
  .navbtn {
    display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 14px 0 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 12px; font: 600 15px Inter, sans-serif; cursor: pointer;
  }
  .navbtn svg { width: 20px; height: 20px; }
  .closebtn {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--surface-2); color: var(--text); font-size: 26px; line-height: 1;
  }

  /* screening page */
  .scr-step { margin: 0 0 20px; }
  .scr-label { font-weight: 600; font-size: 15px; margin: 0 0 10px; }
  .seg.scr-modes { display: flex; width: 100%; max-width: 520px; }
  .scr-modes button { flex: 1; padding: 9px 4px; white-space: nowrap; }
  .scr-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .scr-opts .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 14px; font-size: 14px; text-align: left; }
  .scr-opts .chip .n { font-size: 12px; font-weight: 700; color: var(--muted); }
  .scr-opts .chip.on .n { color: #fff; opacity: .85; }
  .scr-opts .chip.zero:not(.on) { color: var(--muted); border-style: dashed; }
  .scr-clear { margin-top: 10px; padding: 6px 0; border: 0; background: none; color: var(--accent); font: 600 14px Inter, sans-serif; cursor: pointer; }
  .scr-note { margin: 0 0 18px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); font-size: 13px; }
  .scr-count { font-size: 18px; margin: 6px 0 14px; }
  .scr-match { font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .scr-group { margin-bottom: 24px; }

/* ---------------------------------------------------------------------------
   PARSING: normalized slides -> studies
--------------------------------------------------------------------------- */
const STATUS = {
  active: { label: 'Active', color: 'var(--st-active)', icon: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>' },
  paused: { label: 'Paused', color: 'var(--st-paused)', icon: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.6" height="10" rx="1"/><rect x="9.4" y="3" width="2.6" height="10" rx="1"/></svg>' },
  notready: { label: 'Not ready yet', color: 'var(--st-na)', icon: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/></svg>' },
};
const STATUS_ORDER = ['active', 'paused', 'notready'];

function statusKey(text) {
  const t = (text || '').trim().toLowerCase();
  if (!t) return 'none';
  if (t.startsWith('active')) return 'active';
  if (t.startsWith('pause') || t.includes('hold')) return 'paused';
  if (t === 'n/a' || t === 'na') return 'na';
  return 'other';
}

function parseN(text) {
  const m = /\bN[ \t]*=[ \t]*([\d,]+)[ \t]*(?:\/[ \t]*([\d,]+))?([^\n]*)/i.exec(text || '');
  if (!m) return null;
  const num = s => s ? parseInt(s.replace(/,/g, ''), 10) : null;
  return { enrolled: num(m[1]), target: num(m[2]), note: (m[3] || '').trim(), raw: m[0].trim() };
}

/* Labels recognized in a slide's PI box, with the spellings people use for each. */
const FIELD_LABELS = [
  [/^PIs?$/i, 'pi'], [/^Team$/i, 'team'], [/^Fellows?$/i, 'fellow'], [/^Summary$/i, 'summary'], [/^Goals?$/i, 'goal'],
  [/^(IRB|IRB ?#|IRB (number|no\.?)|Study ID|Study #)$/i, 'irb'],
  [/^Inclusion\/Exclusion( criteria)?$/i, 'criteria'],
  [/^(Approval end date|IRB (approval )?(end|expiration) date|Expiration date|Expires)$/i, 'irbEnd'],
];
function parseFields(text) {
  const out = {};
  let lastKey = null;
  for (const raw of (text || '').split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (/^N\s*=/i.test(line)) { lastKey = null; continue; } // enrollment line is parsed separately
    const m = /^([A-Za-z][A-Za-z #/.]*?)\s*(?::\s*(.*)|$)/.exec(line);
    const key = m && (m[2] !== undefined || /^summary$/i.test(m[1])) && (FIELD_LABELS.find(([re]) => re.test(m[1].trim())) || [])[1];
    if (key) {
      lastKey = key;
      out[key] = (m[2] || '').trim();
    } else if (lastKey) {
      out[lastKey] = (out[lastKey] ? out[lastKey] + ' ' : '') + line;
    }
  }
  if (out.irb) out.irb = out.irb.replace(/,?\s*N\s*=.*$/i, '').trim();
  return out;
}

function slideToStudy(slide, w, h, section) {
  const shapes = slide.shapes.map(([x, y, text]) => ({ x: x / w, y: y / h, text: String(text).trim() })).filter(s => s.text);
  const used = new Set();
  const pick = fn => { const s = shapes.find(z => !used.has(z) && fn(z)); if (s) used.add(s); return s; };

  const status = pick(s => s.x > 0.75 && s.y < 0.12 && s.text.length < 30);
  shapes.filter(s => !used.has(s) && s.x > 0.75 && s.y < 0.12 && s.text.length < 30).forEach(s => used.add(s)); // duplicate pills
  const category = pick(s => s.x < 0.1 && s.y < 0.06 && s.text.length < 30 && !s.text.includes('\n'));
  const details = pick(s => /(^|\n)\s*PI\s*:/i.test(s.text));
  const updates = pick(s => /^updates\b/i.test(s.text));
  const titleShape = shapes.filter(s => !used.has(s)).sort((a, b) => a.y - b.y)[0];

  const fields = parseFields(details ? details.text : '');
  const allText = shapes.map(s => s.text).join('\n');
  const n = parseN(details ? details.text : '') || parseN(allText);
  const updateLines = updates ? updates.text.split('\n').slice(1).map(s => s.trim()).filter(Boolean) : [];
  const sk = statusKey(status && status.text);

  const study = {
    slide: slide.n, slideId: slide.id, section,
    title: titleShape ? displayTitle(titleShape.text.replace(/\s*\n\s*/g, ' ').trim()) : '(untitled)',
    category: category ? category.text : guessArea(titleShape ? titleShape.text : '') || 'Other',
    areaSource: category ? 'slide' : guessArea(titleShape ? titleShape.text : '') ? 'guessed' : 'none',
    statusText: status ? status.text : '',
    status: sk === 'active' || sk === 'paused' ? sk : 'notready', // N/A, blank or anything else
    statusLabel: sk === 'active' || sk === 'paused' ? status.text : STATUS.notready.label,
    pi: fields.pi || '', // team and fellow names are intentionally not shown
    summary: fields.summary || fields.goal || '', irb: fields.irb || '', irbEnd: fields.irbEnd || '',
    criteria: fields.criteria || '',
    n, updates: updateLines,
    parts: {
      category: category && category.text, status: status && status.text,
      title: titleShape && titleShape.text, updates: updates && updates.text,
      details: details && details.text, // full text incl. team, shown only in the slide view
      other: shapes.filter(s => !used.has(s) && s !== titleShape).sort((a, b) => a.y - b.y || a.x - b.x).map(s => s.text),
    },
  };
  for (const o of STUDY_OVERRIDES) {
    if (!o.match.test(study.title)) continue;
    o.hits = (o.hits || 0) + 1;
    if (o.exclude) study.excluded = true;
    if (o.area) { study.category = o.area; study.areaSource = 'manual'; }
    if (o.status) study.statusManual = true;
    if (o.status) { study.status = o.status; study.statusLabel = STATUS[o.status].label; }
    if (o.nIsTarget && study.n && !study.n.target) study.n = { enrolled: 0, target: study.n.enrolled, note: '', raw: study.n.raw };
    if (o.addPIs) {
      const have = new Set(piList(study));
      const extra = o.addPIs.filter(p => !have.has(p));
      if (extra.length) {
        study.pi = [study.pi, ...extra].filter(Boolean).join(', ');
        if (study.parts.details) study.parts.details = study.parts.details.replace(/^(\s*PI\s*:\s*)(.*)$/im, (m, k, v) => k + [v.trim(), ...extra].filter(Boolean).join(', '));
      }
    }
  }
  return study;
}

/* Short names the team uses; shown as "Nickname (full name)". `strip` trims a
   trailing nickname that was already part of the slide title. */
const NICKNAMES = [
  { match: /adductor canal block with or without ipack/i, nick: 'IPACK' },
  { match: /effect of internal brace on outcomes following acl/i, nick: 'Internal Brace' },
  { match: /kore registry/i, nick: 'KORE' },
  { match: /patellar lift system/i, nick: 'PELICAN', strip: /\s*\(PELICAN\)\s*$/i },
  { match: /cryoneurolysis with iovera/i, nick: 'Iovera' },
];
function displayTitle(raw) {
  const n = NICKNAMES.find(x => x.match.test(raw));
  if (!n) return raw;
  return `${n.nick} (${n.strip ? raw.replace(n.strip, '') : raw})`;
}

/* Inclusion / exclusion criteria from the study protocols (condensed, approved by Arjan).
   Matched on the study's title; groups are [label, items]. */
const CRITERIA = [
  { match: /effect of internal brace on outcomes following ACL/i,
    inclusion: [['', ['Primary ACLR w/ BTB autograft', 'Age 18-35', 'Able to do std rehab']]],
    exclusion: ['OA KL ≥2', 'Grade 3-4 chondral lesion >2 cm²', 'Active autoimmune/inflammatory dz',

    inclusion: [['All', ['Age ≥18', 'Preop XR (ideally ≥4 views) + preop MRI']],
                ['Meniscal', ['Meniscal tear on exam + MRI (≥1.5T)', 'Needs ≥2 all-inside devices', 'Alignment <5° varus, <7° valgus']]],
    exclusion: ['Current b/l knee injury', 'Ipsilateral knee surg within 12mo', 'LE fracture within 6mo', 'Poor bone quality/quantity',
      'Poor blood supply / prior infection impairing healing', 'Advanced OA (KL grade 3)', 'Meniscal: irreparable tear', "Workers' comp"] },
  { match: /^medial unloader/i,
    inclusion: [['', ['Age 18-60', 'Arthroscopic medial meniscal root repair for symptomatic, MRI-confirmed root tear',

    exclusion: ['Prior ipsilateral knee surg', 'Concomitant ligament recon', 'Advanced OA (KL >2)',

  { match: /^synovial fluid biomarkers$/i,
    inclusion: [['', ['Any knee arthroscopy, or open surgery that starts arthroscopically (e.g. ACL recon, TTO)',
      'i.e. any knee surg except hardware removal, MUA, LOA']]],
    exclusion: ['Inflammatory disease (diabetes ok unless poorly controlled)', 'Injection on day of sample (even if given after)',
      'Injection within past 90 days', 'HIV / Hep C', 'Immunosuppressants (e.g. rheum pts)'] },
  { match: /^CBD Knee OA/i,
    inclusion: [['', ['Knee OA, KL grade 2-3', 'Knee pain for at least 3mos, on at least 1/2 of days', 'VAS ≥4', 'Age 40-75',
      'Premenopausal women: 2 forms of birth control']]],
    exclusion: ['Injection within past 3mos', 'Prior opioid management for knee OA, or opioid dependence', 'Cannabis abuse/dependence',
      'Inflammatory arthritis (e.g. RA, gout, pseudogout)', 'Large effusion', 'BMI >35', 'Coagulation abnormality or thromboembolic disease',
      'Stroke or acute coronary syndrome within 3mos',
      'Renal failure (creatinine >2.83 mg/dL), cirrhosis, moderate/severe hepatic impairment, or abnormal LFTs',
      'Major psych illness, substance abuse disorder, or current/past suicidal ideation', 'Major neurological disorder',
      'Clinically significant illness (inc cardiovascular) or lab abnormalities', 'Pregnant or breastfeeding'] },
];
// From the master sheet when the study came from there; CRITERIA is for the slide fallback.
const criteriaFor = s => s.sheet
  ? (s.sheet.inclusion.length || s.sheet.exclusion.length ? s.sheet : undefined)
  : CRITERIA.find(c => c.match.test(s.title));
function criteriaHtml(s, cls) {
  const c = criteriaFor(s);
  if (!c) return '';
  const list = items => `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  return `<div class="${cls}">
    <div class="ccol"><div class="h">Inclusion</div>${c.inclusion.map(([label, items]) => (label ? `<div class="sub">${esc(label)}</div>` : '') + list(items)).join('')}</div>
    <div class="ccol"><div class="h">Exclusion</div>${list(c.exclusion)}</div>
  </div>`;
}
// Cards: a grey bar that drops the criteria open in place ("+ Show ..." / "- Minimize").
const criteriaToggleHtml = s => criteriaFor(s)
  ? `<details class="critwrap"><summary><span class="when-closed">+ Show inclusion/exclusion criteria</span><span class="when-open">- Minimize</span></summary>${criteriaHtml(s, 'crit')}</details>`
  : '';

/* OR vs office studies. A study not listed here has no tag, appears only under

const STUDY_SETTINGS = [  // from Arjan, 2026-10-26
  // Office
  { match: /HAMMER Technique/i, setting: ['Office'] },
  { match: /^hamstring strength following tear 1 year vs\. 10 year$/i, setting: ['Office'] },
  { match: /^CBD Knee OA/i, setting: ['Office'] },
  // OR
  { match: /^arthrex knee database$/i, setting: ['OR'] },
  { match: /^Internal Brace \(/, setting: ['OR'] },
  { match: /^synovial fluid biomarkers$/i, setting: ['OR'] },
  { match: /^MACI patient registry$/i, setting: ['OR'] },
  { match: /^medial unloader/i, setting: ['OR'] },
  { match: /suture ?loc/i, setting: ['OR'] },
  { match: /^MERCuRE trial$/i, setting: ['OR'] },
  { match: /^jupiter 4\.0$/i, setting: ['OR'] },
  { match: /^outcomes following meniscal repair with BEAR$/i, setting: ['OR'] },
  { match: /^coronal plane alignment and meniscus repair outcomes$/i, setting: ['OR'] },
  { match: /^IPACK \(/, setting: ['OR'] },
  { match: /^KORE \(/, setting: ['OR'] },
  { match: /^BEAR ACL 1-Year Outcomes$/i, setting: ['OR'] },
];
function studySetting(s) {
  if (s.sheet) return s.sheet.settings.length ? { tags: s.sheet.settings, confirmed: true } : { tags: [], confirmed: false };
  const hit = STUDY_SETTINGS.find(x => x.match.test(s.title));
  return hit ? { tags: hit.setting, confirmed: true } : { tags: [], confirmed: false }; // unlabeled: no tag, only under All Studies
}
const settingTag = s => { const t = studySetting(s).tags; return t.length ? `<span class="settag">${t.join(' + ')}</span>` : ''; };

/* Area for a slide with no area label in its top-left corner, guessed from the title.
   First match wins; anything unmatched shows as "Other". */
const AREA_KEYWORDS = [
  ['Hamstring', /\bhamstring/i],
  ['Hip', /\b(hip|FAI|femoroacetabular|gluteal)\b/i],
  ['Shoulder', /\b(shoulder|rotator cuff|RCR|labr(um|al)|bankart|latarjet|remplissage|glenoid|biceps|pec(toralis)?|elbow|SLAP)\b/i],
  ['Knee', /\b(knee|ACL|ACLR|PCL|MCL|menisc\w*|patell\w*|MPFL|trochle\w*|tibial|HTO|DFO|TTO|MACI|OCA|MAT|BEAR|cartilage|osteotomy|quad\w*|root repair)\b/i],
];
const guessArea = title => (AREA_KEYWORDS.find(([, re]) => re.test(title)) || [])[0];

/* Manual adjustments from Arjan. Each one is matched on the study's title (never its
   slide number), so they survive slides being reordered, added or removed. If a title
   is edited in the deck and an adjustment stops matching, the page shows a warning.
   status: override the tracker status
   nIsTarget: the slide's "N = x" is the enrollment target, not patients enrolled
   addPIs: extra PIs not listed on the slide
   area: override the area label (Knee, Shoulder, Hamstring, ...)
   exclude: leave the study off the tracker entirely */
const STUDY_OVERRIDES = [
  { match: /liposomal bupivacaine versus standard bupivacaine/i, status: 'notready', nIsTarget: true },
  { match: /cryoneurolysis with iovera/i, status: 'notready' },
  { match: /meniscal root repair effect on varus alignment/i, status: 'notready' },
  { match: /BEAR ACL 1-Year Outcomes/i, status: 'paused' }, // reason comes from its IRB update line
  { match: /^MISHA RCT$/i, exclude: true },
  { match: /^AI Responses to PRP vs\. Corticosteroids vs\. Stem Cells in Meniscal Management$/i, exclude: true },
  { match: /^synovial fluid biomarkers$/i, addPIs: ['Strickland', 'Gomoll'] },
  { match: /^MACI patient registry$/i, addPIs: ['Strickland', 'Gomoll'] },
  { match: /^MERCuRE trial$/i, addPIs: ['Gomoll'] },
  { match: /^hamstring strength following tear 1 year vs\. 10 year$/i, area: 'Hamstring' },
  { match: /^extended oral tranexamic acid after ACL reconstruction/i, area: 'Knee' },
];

/* For paused studies, the update lines that explain why (holds, IRB/FDA, funding). */
const REASON = /\b(hold|paused?|FDA|IRB|funding|budget|sponsor|contract|waiting|pending|stopp|suspend)/i;
const pausedReason = s => s.status === 'paused' ? s.updates.filter(u => REASON.test(u)) : [];
const PAUSE_ICON = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.6" height="10" rx="1"/><rect x="9.4" y="3" width="2.6" height="10" rx="1"/></svg>';
const reasonHtml = s => pausedReason(s).map(r => `<div class="reason">${PAUSE_ICON}<span>${esc(r)}</span></div>`).join('');

function isHeader(slide) {
  const texts = slide.shapes.map(s => String(s[2]).trim()).filter(Boolean);
  return texts.length === 1 && texts[0].length < 40 && !texts[0].includes('\n');
}

function buildStudies(data) {
  if (data.source === 'sheet') return studiesFromSheet(data.rows);
  STUDY_OVERRIDES.forEach(o => o.hits = 0);
  const studies = [];
  let section = null;
  for (const slide of data.slides) {
    if (slide.hidden) continue; // hidden (skipped) slides never appear
    if (isHeader(slide)) { section = String(slide.shapes[0][2]).trim(); continue; }
    if (!section || !CONFIG.includeSections.some(re => re.test(section))) continue;
    const study = slideToStudy(slide, data.w, data.h, section);
    if (!study.excluded) studies.push(study);
  }
  return studies;
}

/* ---------------------------------------------------------------------------
   MASTER SHEET: the Google Sheet that sheet/Code.gs keeps in step with the deck.
   Each row holds what the slide reader above produces, plus the team's columns
   (nickname, overrides, OR/Office, criteria, procedures...), so
   STUDY_OVERRIDES, NICKNAMES, STUDY_SETTINGS and CRITERIA only apply when the
   sheet can't be reached and the page reads the slides instead.
--------------------------------------------------------------------------- */
const SHEET_CSV = () => `https://docs.google.com/spreadsheets/d/${CONFIG.sheet.id}/export?format=csv&gid=${CONFIG.sheet.gid}`;

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') field += c;
      else if (text[i + 1] === '"') { field += '"'; i++; }
      else quoted = false;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// "2026-10-28 9:05" (the sheet's Last seen format) -> Date
function sheetDate(text) {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?: (\d{1,2}):(\d{2}))?/.exec(text || '');
  return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null;
}

async function fetchSheet() {
  const res = await fetch(SHEET_CSV(), { cache: 'no-store' });
  if (!res.ok) throw new Error(`Google returned ${res.status} for the master sheet. Is it still shared with "anyone with the link"?`);
  const [head, ...body] = parseCsv(await res.text());
  if (!head || !head.includes('Slide ID')) throw new Error("The master sheet doesn't have the expected columns.");
  const rows = body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
  const last = Math.max(0, ...rows.map(r => +(sheetDate(r['Last seen in deck']) || 0)));
  return { source: 'sheet', syncedAt: new Date(last).toISOString(), rows };
}

const cellLines = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
const cellList = t => String(t || '').split(',').map(s => s.trim()).filter(Boolean);

/* Built from the slide columns plus the team's columns, the same way the sheet fills
   its Study/Status/Area/PI/Enrolled/Target columns. Those are only recalculated when
   the sheet syncs, so reading them would hide the team's edits until the next sync. */
function sheetToStudy(r) {
  const slideTitle = r['Slide title'];
  const nick = r['Nickname'].trim();
  const title = nick
    ? `${nick} (${slideTitle.replace(new RegExp('\\s*\\(' + nick.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\)\\s*$', 'i'), '')})`
    : slideTitle;
  const statusText = r['Status on slide'], sk = statusKey(statusText);
  const override = { active: 'active', paused: 'paused', 'not ready yet': 'notready' }[r['Status override'].trim().toLowerCase()];
  const status = override || (sk === 'active' || sk === 'paused' ? sk : 'notready');
  const areaOverride = r['Area override'].trim(), guessed = guessArea(slideTitle);
  let details = r['Details box (full text)'];
  const slidePI = parseFields(details).pi || '';
  const extraPIs = cellList(r['Extra PIs']).filter(p => !piList({ pi: slidePI }).includes(p));
  const pi = [slidePI, ...extraPIs].filter(Boolean).join(', ');
  if (extraPIs.length) details = details.replace(/^(\s*PI\s*:\s*)(.*)$/im, (m, k) => k + pi);
  let n = parseN(r['Enrollment line on slide']);
  if (r['N on slide is target'] === 'TRUE' && n && !n.target) n = { enrolled: 0, target: n.enrolled, note: '', raw: n.raw };
  const inclusion = []; // [[group label, items]]; a line ending in ":" starts a group
  for (const line of cellLines(r['Inclusion criteria'])) {
    if (line.endsWith(':')) inclusion.push([line.slice(0, -1), []]);
    else { if (!inclusion.length) inclusion.push(['', []]); inclusion[inclusion.length - 1][1].push(line); }
  }
  const updates = cellLines(r['Updates']);
  return {
    slide: Number(r['Slide #']), slideId: r['Slide ID'], section: r['Section'],
    title,
    category: areaOverride || r['Area on slide'] || guessed || 'Other',
    areaSource: areaOverride ? 'manual' : r['Area on slide'] ? 'slide' : guessed ? 'guessed' : 'none',
    statusText, status, statusManual: !!override,
    statusLabel: !override && (sk === 'active' || sk === 'paused') ? statusText : STATUS[status].label,
    pi, summary: r['Summary'], irb: r['IRB #'], irbEnd: r['IRB end date'],
    criteria: r['Inclusion/Exclusion on slide'],
    n, updates,
    sheet: { inclusion, exclusion: cellLines(r['Exclusion criteria']), settings: cellList(r['Setting (OR / Office)']),
      procedures: cellList(r['Procedures']), injuries: cellList(r['Injuries / Diagnoses']) },
    parts: {
      category: r['Area on slide'], status: statusText, title: slideTitle,
      updates: updates.length ? ['Updates:', ...updates].join('\n') : '',
      details, other: r['Other slide text'] ? [r['Other slide text']] : [],
    },
  };
}

// Rows on the site: linked to a slide still in the deck, and not ticked "Hide from site".
function studiesFromSheet(rows) {
  return rows.filter(r => r['Slide ID'] && r['Sync status'] === 'In deck' && r['Hide from site'] !== 'TRUE')
    .map(sheetToStudy).sort((a, b) => a.slide - b.slide);
}

/* ---------------------------------------------------------------------------
   LIVE LOADER: public PowerPoint export -> normalized slides
   Google puts all slide XML near the start of the export and the images after
   it, so the download is read as it streams and cut off once every slide has
   arrived (about 1.3 MB of a ~22 MB file). Hidden slides carry show="0".
--------------------------------------------------------------------------- */
const EXPORT_URL = () => `https://docs.google.com/presentation/d/${CONFIG.presentationId}/export/pptx`;
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).text();
}

/* Streams the zip and returns {name: xmlText} for the entries we need. */
async function streamPptxXml(onProgress) {
  const ctrl = new AbortController();
  const res = await fetch(EXPORT_URL() + '?t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' });
  if (!res.ok) throw new Error(`Google returned ${res.status}. Is the deck still shared with "anyone with the link"?`);
  const reader = res.body.getReader();
  let buf = new Uint8Array(2 << 20), len = 0, pos = 0, done = false;
  const files = {}, pending = [];
  let wanted = null; // slide files listed in presentation.xml.rels, once known
  const isWanted = n => /^ppt\/slides\/slide\d+\.xml$/.test(n) || n === 'ppt/presentation.xml' || n === 'ppt/_rels/presentation.xml.rels';
  const haveAll = () => wanted && files['ppt/presentation.xml'] !== undefined && wanted.every(n => files[n] !== undefined);

  // Parse as many complete entries as the buffer holds; returns false when it needs more bytes.
  async function parse() {
    while (pos + 30 <= len) {
      const sig = u32(buf, pos);
      if (sig !== 0x04034b50) return 'end'; // central directory or something else: no more file entries
      const flags = u16(buf, pos + 6), method = u16(buf, pos + 8);
      let csize = u32(buf, pos + 18);
      const nlen = u16(buf, pos + 26), xlen = u16(buf, pos + 28);
      if (pos + 30 + nlen + xlen > len) return false;
      const name = new TextDecoder().decode(buf.subarray(pos + 30, pos + 30 + nlen));
      const start = pos + 30 + nlen + xlen;
      let end, next;
      if (flags & 8) {
        // sizes live in a data descriptor after the data: find PK\x07\x08 whose size field matches
        end = -1;
        for (let i = start; i + 16 <= len; i++) {
          if (buf[i] === 0x50 && buf[i + 1] === 0x4b && buf[i + 2] === 7 && buf[i + 3] === 8 && u32(buf, i + 8) === i - start) { end = i; break; }
        }
        if (end < 0) return false;
        next = end + 16;
      } else {
        end = start + csize;
        if (end > len) return false;
        next = end;
      }
      if (isWanted(name)) {
        const data = buf.slice(start, end);
        pending.push((method === 8 ? inflateRaw(data) : Promise.resolve(new TextDecoder().decode(data))).then(t => {
          files[name] = t;
          if (name === 'ppt/_rels/presentation.xml.rels') {
            wanted = [...t.matchAll(/Target="(slides\/slide\d+\.xml)"/g)].map(m => 'ppt/' + m[1]);
          }
        }));
      }
      pos = next;
    }
    return false;
  }

  while (!done) {
    const { value, done: d } = await reader.read();
    if (d) break;
    if (len + value.length > buf.length) { const nb = new Uint8Array(Math.max(buf.length * 2, len + value.length)); nb.set(buf.subarray(0, len)); buf = nb; }
    buf.set(value, len); len += value.length;
    onProgress && onProgress(len);
    if ((await parse()) === 'end') break;
    await Promise.all(pending);
    if (haveAll()) break;
  }
  ctrl.abort(); // stop downloading the images
  await Promise.all(pending);
  if (!files['ppt/presentation.xml'] || !wanted) throw new Error('The slide download was incomplete. Try again.');
  return { files, bytes: len };
}

const NS = { p: 'http://schemas.openxmlformats.org/presentationml/2006/main', a: 'http://schemas.openxmlformats.org/drawingml/2006/main', r: 'http://schemas.openxmlformats.org/officeDocument/2006/relationships' };
const kids = (el, ns, tag) => [...el.children].filter(c => c.namespaceURI === NS[ns] && c.localName === tag);
const kid = (el, ns, tag) => kids(el, ns, tag)[0];

function paraText(txBody) {
  return [...txBody.getElementsByTagNameNS(NS.a, 'p')].map(p =>
    [...p.childNodes].map(n => n.localName === 'r' || n.localName === 'fld' ? (n.getElementsByTagNameNS(NS.a, 't')[0] || {}).textContent || ''
                             : n.localName === 'br' ? '\n' : '').join('')).join('\n');
}

// Walk a shape tree, mapping child coordinates through any group transforms.
function walkShapes(tree, map, out) {
  for (const el of tree.children) {
    const tag = el.localName;
    if (tag === 'grpSp') {
      const x = el.getElementsByTagNameNS(NS.a, 'xfrm')[0];
      let m = map;
      if (x) {
        const v = (t, a) => +((kid(x, 'a', t) || { getAttribute: () => 0 }).getAttribute(a) || 0);
        const ox = v('off', 'x'), oy = v('off', 'y'), ex = v('ext', 'cx') || 1, ey = v('ext', 'cy') || 1;
        const cx = v('chOff', 'x'), cy = v('chOff', 'y'), cex = v('chExt', 'cx') || ex, cey = v('chExt', 'cy') || ey;
        const sx = ex / cex, sy = ey / cey;
        m = (px, py) => map(ox + (px - cx) * sx, oy + (py - cy) * sy);
      }
      walkShapes(el, m, out);
      continue;
    }
    let off = null, text = '';
    if (tag === 'sp') {
      const xf = el.getElementsByTagNameNS(NS.a, 'xfrm')[0];
      off = xf && kid(xf, 'a', 'off');
      const tb = kid(el, 'p', 'txBody');
      if (tb) text = paraText(tb);
    } else if (tag === 'graphicFrame') {
      const xf = kid(el, 'p', 'xfrm');
      off = xf && kid(xf, 'a', 'off');
      text = [...el.getElementsByTagNameNS(NS.a, 'tc')].map(tc => paraText(tc)).filter(Boolean).join('\n');
    } else continue;
    text = text.replace(/[ \t ]{2,}/g, ' ').replace(/ *\n */g, '\n')
      .replace(/(:\s*)\.?(\d+)\.(?=\n|$)/g, '$1$2') // "Enrolled this week: .5." -> "Enrolled this week: 5"
      .trim();
    if (!text) continue;
    const [x, y] = off ? map(+off.getAttribute('x'), +off.getAttribute('y')) : [0, 0];
    out.push([x, y, text]);
  }
  return out;
}

async function fetchLive(onProgress) {
  const { files } = await streamPptxXml(onProgress);
  return parseDeck(files, new Date().toISOString());
}

/* Slide XML -> normalized slides. A slide listed in the deck but missing from
   `files` is treated as hidden (the shared copy leaves hidden slides out). */
function parseDeck(files, syncedAt) {
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const pres = xml(files['ppt/presentation.xml']);
  const sz = pres.getElementsByTagNameNS(NS.p, 'sldSz')[0];
  const rels = {};
  const relDoc = xml(files['ppt/_rels/presentation.xml.rels'] || '<x/>');
  for (const r of relDoc.getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = 'ppt/' + r.getAttribute('Target').replace(/^\.?\//, '');
  const ids = [...pres.getElementsByTagNameNS(NS.p, 'sldId')].map(e => e.getAttributeNS(NS.r, 'id'));
  const slides = ids.map((rid, i) => {
    const name = rels[rid];
    const doc = xml(files[name] || '<p:sld xmlns:p="' + NS.p + '"/>');
    const root = doc.documentElement;
    const tree = root.getElementsByTagNameNS(NS.p, 'spTree')[0];
    return {
      n: i + 1, id: name.replace(/^.*\/|\.xml$/g, ''),
      hidden: !files[name] || root.getAttribute('show') === '0',
      shapes: tree ? walkShapes(tree, (x, y) => [x, y], []) : [],
    };
  });
  return { syncedAt, source: 'live', w: +sz.getAttribute('cx'), h: +sz.getAttribute('cy'), slides };
}

/* Shared copy on the host (Netlify function at /api/slides). Each Refresh pulls the
   deck there, so anyone opening the site afterwards starts from that pull. When the
   page isn't on a host with the function (e.g. opened as a file), these return null
   and the page falls back to reading Google directly. */
const SHARED_API = '/api/slides';
const onHost = /^https?:$/.test(location.protocol);
async function sharedRequest(method) {
  if (!onHost) return null;
  let r;
  try { r = await fetch(SHARED_API, { method, cache: 'no-store' }); } catch (e) { return null; }
  if (r.status === 404 && method === 'GET') {
    const j = await r.json().catch(() => null);
    return j && j.error ? { empty: true } : null; // function exists but nothing saved yet
  }
  if (!(r.headers.get('content-type') || '').includes('json')) return null; // no function on this host
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || `Server error ${r.status}`);
  return { data: parseDeck(j.files, j.syncedAt) };
}

/* The last refresh is kept in this browser, so reopening the page shows it. */
const SAVED_KEY = 'prospective-studies:last-refresh';
function saveLive(data) { try { localStorage.setItem(SAVED_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ } }
function savedLive() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVED_KEY) || 'null');
    return d && d.slides && new Date(d.syncedAt) > new Date(SNAPSHOT.syncedAt) ? d : null;
  } catch (e) { return null; }
}
/* Likewise the last read of the master sheet, shown at once while a fresh read loads. */
const SHEET_KEY = 'prospective-studies:sheet';
function saveSheet(data) { try { localStorage.setItem(SHEET_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ } }
function savedSheet() {
  try { const d = JSON.parse(localStorage.getItem(SHEET_KEY) || 'null'); return d && d.rows ? d : null; } catch (e) { return null; }
}

/* ---------------------------------------------------------------------------

--------------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pill = s => `<span class="pill ${s.status}">${STATUS[s.status].icon}${esc(s.statusLabel)}</span>`;

const state = { studies: [], data: null, category: 'All', setting: 'all', q: '', view: 'cards', pis: new Set(), researchers: new Set() };

/* PI names on a study, e.g. "Bixby, Alon Shertzer (peds anesthesia)" -> ["Bixby", "Alon Shertzer"] */
const piList = s => s.pi.split(/[,;/]|\band\b/).map(x => x.replace(/\(.*?\)/g, '').trim()).filter(Boolean);
const HIDDEN_CATEGORY_CHIPS = ['General'];

const SETTING_FILTERS = [['all', 'All Studies'], ['or', 'OR Studies'], ['office', 'Office Studies']];
function settingMatches(s) {
  const t = studySetting(s).tags;
  if (!t.length) return true; // not labeled yet: always shown
  return state.setting === 'all' || (state.setting === 'or' && t.includes('OR')) ||
    (state.setting === 'office' && t.includes('Office'));
}

function filtered() {
  const q = state.q.toLowerCase();
  return state.studies.filter(s =>
    (state.category === 'All' || s.category === state.category) &&
    settingMatches(s) &&
    (!state.pis.size || piList(s).some(p => state.pis.has(p))) &&
    (!q || [s.title, s.pi, s.summary, s.updates.join(' ')].join(' ').toLowerCase().includes(q)));
}

/* Studies on the tiles and their pages: all of them, or only the selected PIs' ("My ..."). */
// Like the PI filter, the All / OR / Office choice applies site-wide (tiles, chart, list, pages).
const piScoped = () => state.studies.filter(s => settingMatches(s) && (!state.pis.size || piList(s).some(p => state.pis.has(p))));

function renderWelcome() {
  const el = $('welcome');
  const pis = [...state.pis];
  if (!pis.length) { el.hidden = true; el.innerHTML = ''; return; }
  const prof = p => PI_PROFILES[p] || { last: p.replace(/^[A-Z]\.\s*/, ''), name: p };
  const names = pis.map(p => `Dr. ${prof(p).last.replace(/-/g, '‑')}`); // keep "Dr. Name" and hyphenated names on one line
  const who = names.length === 1 ? names[0] : names.length === 2 ? names.join(' & ') : `${names.slice(0, -1).join(', ')} & ${names[names.length - 1]}`;
  el.innerHTML = `<div class="wtext"><div class="w1">Welcome,</div><div class="w2">${esc(who)}</div></div>
    <div class="wphotos">${pis.filter(p => PI_PROFILES[p]).slice(0, 4).map(p => `<img src="${PI_PROFILES[p].photo}" alt="${esc(PI_PROFILES[p].name)}" title="${esc(PI_PROFILES[p].name)}">`).join('')}</div>`;
  el.classList.toggle('multi', pis.length > 1);
  el.hidden = false;
}

function renderKpis() {
  renderWelcome();
  const S = piScoped(), my = state.pis.size > 0, M = t => my ? `My ${t}` : t;
  const c = k => S.filter(s => s.status === k).length;
  const enrolled = S.reduce((a, s) => a + (s.n && s.n.enrolled || 0), 0);
  // the main tile leaves out Synovial Fluid Biomarkers, which would swamp everything else
  const sf = S.find(s => SYNOVIAL.test(s.title) && s.n);
  const sfN = sf ? sf.n.enrolled : 0;
  const tile = (route, label, value, note, dot) => `<a class="kpi navlink" href="${pageHref(route)}"><div class="label">${dot ? `<span class="dot" style="background:${dot}"></span>` : ''}${label}<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div><div class="value">${value}</div>${note ? `<div class="note">${note}</div>` : ''}</a>`;
  $('kpis').innerHTML =
    tile('studies', M('Total Prospective Studies'), S.length, '') +
    tile('active', M('Active'), c('active'), '', STATUS.active.color) +
    tile('paused', M('Paused'), c('paused'), '', STATUS.paused.color) +
    tile('notready', my ? 'My Not Ready Yet' : 'Not ready yet', c('notready'), '', STATUS.notready.color) +
    // with a PI selected, the total includes Synovial Fluid when it's one of theirs
    (my ? tile('enrolled', 'My Studies\' Patients Enrolled', enrolled.toLocaleString(), '')
        : tile('enrolled', 'Patients enrolled', (enrolled - sfN).toLocaleString(), sfN ? `+ ${sfN.toLocaleString()} Synovial Fluid pts` : ''));
}

/* Enrollment pie: the 7 largest studies get their own color; the rest fold into "Other". */
const PIE_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)'];
const SHORT_NAMES = [
  [/^synovial fluid biomarkers$/i, 'Synovial Fluid'], [/arthrex knee database/i, 'Arthrex Knee'],
  [/^KORE /, 'KORE'], [/^IPACK /, 'IPACK'], [/^Internal Brace /, 'Internal Brace'], [/^PELICAN /, 'PELICAN'],
  [/CBD Knee OA/i, 'CBD Knee OA'], [/hamstring strength following tear/i, 'Hamstring 1 vs 10 yr'],
  [/HAMMER/i, 'HAMMER'], [/BEAR ACL 1-Year/i, 'BEAR ACL'], [/meniscal repair with BEAR/i, 'BEAR Meniscus'],
  [/suture ?loc/i, 'SutureLoc'], [/jupiter/i, 'Jupiter 4.0'], [/coronal plane alignment/i, 'Coronal Alignment'],
  [/MACI patient registry/i, 'MACI Registry'], [/MISHA/i, 'MISHA'], [/medial unloader/i, 'Medial Unloader'],
  [/liposomal bupivacaine/i, 'Liposomal Bupi'], [/^Iovera /, 'Iovera'], [/MERCuRE/i, 'MERCuRE'],
];
const shortName = s => (SHORT_NAMES.find(([re]) => re.test(s.title)) || [, s.title.length > 22 ? s.title.slice(0, 20) + '…' : s.title])[1];

function pieSlices(withN) {
  const colorOf = new Map();
  const own = withN.length > 8 ? withN.slice(0, 7) : withN;
  const rest = withN.slice(own.length);
  const list = own.map((s, i) => { colorOf.set(s, PIE_COLORS[i]); return { label: shortName(s), value: s.n.enrolled, color: PIE_COLORS[i], slide: s.slide }; });
  if (rest.length) {
    rest.forEach(s => colorOf.set(s, 'var(--c-other)'));
    list.push({ label: `Other (${rest.length} studies)`, value: rest.reduce((a, s) => a + s.n.enrolled, 0), color: 'var(--c-other)', members: rest.map(shortName) });
  }
  return { list, colorOf };
}

function pieSvg(list, total) {
  const W = 680, H = 320, cx = W / 2, cy = H / 2, r = 120, ri = 70;
  const deg = v => v / total * 360;
  // rotate so everything after the largest slice is centered on the left
  let a = 270 + (360 - deg(list[0].value)) / 2;
  const pt = (ang, rad) => [cx + rad * Math.sin(ang * Math.PI / 180), cy - rad * Math.cos(ang * Math.PI / 180)];
  const arcs = [], labels = [];
  for (const sl of list) {
    const d = deg(sl.value), a0 = a, a1 = a + d, large = d > 180 ? 1 : 0;
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r), [x2, y2] = pt(a1, ri), [x3, y3] = pt(a0, ri);
    const tip = `${esc(sl.label)}: ${sl.value.toLocaleString()} (${(sl.value / total * 100).toFixed(1)}%)${sl.members ? '<br>' + esc(sl.members.join(', ')) : ''}`;
    arcs.push(`<path d="M${x0} ${y0}A${r} ${r} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${large} 0 ${x3} ${y3}Z" fill="${sl.color}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(tip)}" ${sl.slide ? `data-slide="${sl.slide}" class="slice"` : ''}/>`);
    const mid = (a0 + a1) / 2;
    labels.push({ sl, mid, left: Math.sin(mid * Math.PI / 180) < 0, y: pt(mid, r + 16)[1] });
    a = a1;
  }
  // stack labels on each side so they never overlap
  const gap = 30;
  for (const side of [true, false]) {
    const L = labels.filter(l => l.left === side).sort((p, q) => p.y - q.y);
    for (let i = 1; i < L.length; i++) L[i].y = Math.max(L[i].y, L[i - 1].y + gap);
    const over = L.length ? L[L.length - 1].y - (H - 14) : 0;
    if (over > 0) L.forEach(l => l.y -= over);
    for (let i = L.length - 2; i >= 0; i--) L[i].y = Math.min(L[i].y, L[i + 1].y - gap);
  }
  const text = labels.map(({ sl, mid, left, y }) => {
    const [px, py] = pt(mid, r + 2), [ex, ey] = pt(mid, r + 14);
    const lx = left ? cx - r - 40 : cx + r + 40;
    const anchor = left ? 'end' : 'start', tx = left ? lx - 6 : lx + 6;
    return `<polyline points="${px},${py} ${ex},${ey} ${lx},${y}" fill="none" stroke="var(--muted)" stroke-width="1"/>
      <text x="${tx}" y="${y - 2}" text-anchor="${anchor}" class="pl-name">${esc(sl.label)}</text>
      <text x="${tx}" y="${y + 13}" text-anchor="${anchor}" class="pl-val">${sl.value.toLocaleString()} · ${(sl.value / total * 100).toFixed(1)}%</text>`;
  }).join('');
  const center = `<text x="${cx}" y="${cy - 2}" text-anchor="middle" class="pc-val">${total.toLocaleString()}</text>
    <text x="${cx}" y="${cy + 18}" text-anchor="middle" class="pc-lbl">enrolled</text>`;
  // phones get the ring alone (cropped tight) with the legend underneath
  return `<svg class="pie pie-wide" viewBox="0 0 ${W} ${H}" role="img" aria-label="Patients enrolled by study">${arcs.join('')}${text}${center}</svg>
  <svg class="pie pie-ring" viewBox="${cx - r - 4} ${cy - r - 4} ${2 * r + 8} ${2 * r + 8}" role="img" aria-label="Patients enrolled by study">${arcs.join('')}${center}</svg>`;
}

function pieLegend(list, total) {
  return `<ul class="pielegend">${list.map(sl => `<li><span class="dot" style="background:${sl.color}"></span><span class="pn">${esc(sl.label)}</span><b>${sl.value.toLocaleString()}</b><small>${(sl.value / total * 100).toFixed(1)}%</small></li>`).join('')}</ul>`;
}

  const forced = new URLSearchParams(location.search).get('season');
  if (forced) return forced === 'none' ? '' : forced;
  const m = d.getMonth() + 1, day = d.getDate();
  if (m === 10 || (m === 11 && day <= 7)) return 'halloween';
  if (m === 11 && day >= 15) return 'thanksgiving';
  if (m === 12) return 'christmas';

}

function renderDetail(key) {
  const S = piScoped();
  const of = k => S.filter(s => s.status === k).sort(bySlide);
  let html = '';
  if (key === 'studies') {
    html = `<h2 class="dtitle">${S.length} studies</h2>` +

      `<div class="dtotal"><span>Total</span><b>${total.toLocaleString()}</b></div>` +
      group('No patients enrolled or no N reported (not counted)', without, s => studyRow(s, '-'));

function cobweb(flip) {
  const r = [18, 34, 50, 66], ang = [0, 18, 36, 54, 72, 90].map(a => a * Math.PI / 180);
  const pt = (rad, a) => [rad * Math.cos(a), rad * Math.sin(a)];
  let d = ang.map(a => { const [x, y] = pt(78, a); return `M0 0L${x.toFixed(1)} ${y.toFixed(1)}`; }).join('');
  r.forEach(rad => {
    for (let i = 0; i < ang.length - 1; i++) {
      const [x1, y1] = pt(rad, ang[i]), [x2, y2] = pt(rad, ang[i + 1]), mid = (ang[i] + ang[i + 1]) / 2, [cx, cy] = pt(rad * 0.82, mid);
      d += `M${x1.toFixed(1)} ${y1.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    }
  });
  return `<svg class="web ${flip ? 'web-r' : 'web-l'}" viewBox="0 0 80 80" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>`;
